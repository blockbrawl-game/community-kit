<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mode dev kit (remote)</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --line: #dfe2e8; --text: #1b1f27; --dim: #667085;
    --accent: #2f6fed; --ok: #1f9d55; --bad: #d64545;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101216; --panel: #191c22; --line: #2a2f39; --text: #e6e8ee; --dim: #8b93a5;
      --accent: #6aa0ff; --ok: #5fd08a; --bad: #ff6b76;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, sans-serif; display: flex; flex-direction: column; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; }
  header .meta { color: var(--dim); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  header .spacer { flex: 1; }
  .banner { display: none; padding: 8px 16px; background: color-mix(in srgb, var(--bad) 18%, var(--panel)); border-bottom: 1px solid var(--bad); }
  .banner.show { display: block; }
  .players { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .player { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; width: 320px; max-width: 100%; overflow: hidden; }
  .player .head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .player .head b { flex: 1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); }
  .player iframe { display: block; width: 100%; height: 600px; border: 0; }
  .counts { padding: 8px 10px; border-top: 1px solid var(--line); color: var(--dim); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1 id="title">Mode dev kit</h1>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <button id="restart" class="primary">New match</button>
</header>
<div class="banner" id="banner"></div>
<div class="players" id="players"></div>

<script type="module">
const $ = (id) => document.getElementById(id);
const info = await (await fetch('/api/info')).json();
const panels = [];

$('title').textContent = `${info.manifest.name} ${info.manifest.version}`;
document.title = `${info.manifest.name} · dev kit (remote)`;
$('meta').textContent = `remote · ${info.remote.gateway} · match ${info.remote.matchId}`;

info.players.forEach((player, index) => {
  const el = document.createElement('section');
  el.className = 'player';
  el.innerHTML = `
    <div class="head"><span class="dot"></span><b></b><button data-act="conn">Disconnect</button></div>
    <iframe title="Player ${index + 1}"></iframe>
    <div class="counts"></div>`;
  el.querySelector('b').textContent = player.name;
  const frame = el.querySelector('iframe');
  frame.src = `/player.html?player=${player.id}`;
  const panel = { el, frame, player, connected: false };
  panels.push(panel);
  el.querySelector('[data-act=conn]').addEventListener('click', () => {
    frame.contentWindow.postMessage({ bbDev: panel.connected ? 'disconnect' : 'reconnect' }, location.origin);
  });
  $('players').appendChild(el);
});

addEventListener('message', (event) => {
  if (event.origin !== location.origin || event.data?.bbDev !== 'stat') return;
  const panel = panels.find((p) => p.player.id === event.data.playerId);
  if (!panel) return;
  panel.connected = event.data.connected;
  panel.el.querySelector('.dot').classList.toggle('on', panel.connected);
  panel.el.querySelector('[data-act=conn]').textContent = panel.connected ? 'Disconnect' : 'Reconnect';
  panel.el.querySelector('.counts').textContent = `seq ${event.data.lastSeq} · ${event.data.syncs} syncs · ${event.data.gaps} gaps detected`;
});

$('restart').addEventListener('click', async () => {
  const response = await fetch('/api/restart', { method: 'POST' });
  if (!response.ok) {
    $('banner').textContent = (await response.json()).error ?? 'Could not start a new match.';
    $('banner').classList.add('show');
    return;
  }
  // New match, new players and tickets: start over.
  location.reload();
});
</script>
</body>
</html>
