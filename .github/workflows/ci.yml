name: CI

on:
  pull_request:
  push:
    branches: [main]

# Fork PRs get a read-only token and no secrets. Never switch this to pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      # Shrinkwrap only, no install scripts: a PR can't run code at install time.
      - run: npm ci --ignore-scripts
      - name: Dev kit unit tests
        run: node --test "tests/**/*.test.mjs"
      # brawl-modes check on every mode (policy, test, bench, build), and the bench numbers must equal
      # scripts/bench-baseline.json exactly: work units are the same on every machine, and this proves it.
      - name: Check every mode
        run: node scripts/check-modes.mjs --baseline

      - name: The packed kit has what a game needs
        run: |
          rm -rf modes/*/dist
          npm pack --dry-run --json > pack.json
          node -e '
            const files = new Set(JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0].files.map((f) => f.path));
            const need = ["devkit/cli.js", "sdk/server.js", "runtime/prelude.js", "runtime/limits.json", "shell/shell.js", "shell/transport-signalr.js", "npm-shrinkwrap.json", "LICENSE"];
            const missing = need.filter((f) => !files.has(f));
            if (missing.length) { console.error("missing from the package: " + missing.join(", ")); process.exit(1); }
            console.log(files.size + " files packed");'
