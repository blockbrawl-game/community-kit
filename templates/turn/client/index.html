<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__MODE_NAME__</title>
<style>
  :root { --bg: #14161c; --panel: #1f232c; --text: #eef0f4; --muted: #9aa3b2; --accent: #5aa9ff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, sans-serif; }
  main { width: min(420px, 100vw - 32px); text-align: center; }
  .total { font-size: 96px; font-weight: 800; margin: 8px 0; }
  .turn { color: var(--muted); min-height: 1.4em; }
  .buttons { display: flex; gap: 12px; justify-content: center; margin: 24px 0; }
  button { flex: 1; padding: 18px 0; font-size: 22px; font-weight: 700; border: 0; border-radius: 12px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { background: var(--panel); color: var(--muted); cursor: default; }
  .players { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; color: var(--muted); }
  .players .active { color: var(--text); font-weight: 700; }
  .players .left { text-decoration: line-through; }
</style>
</head>
<body>
<main>
  <div class="turn" id="turn">Connecting…</div>
  <div class="total" id="total">0</div>
  <div class="buttons" id="buttons"></div>
  <div class="players" id="players"></div>
</main>
<script type="module">
import { connect } from '@blockbrawl/mode-sdk/client';
import { createModel } from './model.js';
import { MAX_ADD, TARGET } from '../shared.js';

const model = createModel();
const { state } = model;
const $ = (id) => document.getElementById(id);

const game = connect({
  model,
  onChange: render,
  onRejected(actionId, reason) { $('turn').textContent = `Not allowed: ${reason}`; },
});

for (let n = 1; n <= MAX_ADD; n++) {
  const button = document.createElement('button');
  button.textContent = `+${n}`;
  button.addEventListener('click', () => game.send({ t: 'add', n }));
  $('buttons').appendChild(button);
}

function name(p) {
  if (p === model.myIndex) return 'You';
  return game.players.find((pl) => pl.id === state.order[p])?.name ?? `Player ${p + 1}`;
}

function render() {
  if (!game.ready) return;
  $('total').textContent = `${state.total} / ${TARGET}`;
  const myTurn = state.winner === -1 && state.turn === model.myIndex;
  for (const button of $('buttons').children) button.disabled = !myTurn;
  $('turn').textContent = state.winner !== -1
    ? (state.winner === model.myIndex ? 'You win!' : `${name(state.winner)} wins`)
    : myTurn ? 'Your turn' : `${name(state.turn)} is thinking…`;
  $('players').replaceChildren(...state.order.map((_, p) => {
    const el = document.createElement('span');
    el.textContent = name(p);
    if (p === state.turn && state.winner === -1) el.className = 'active';
    if (state.forfeited[p]) el.className = 'left';
    return el;
  }));
}
</script>
</body>
</html>
